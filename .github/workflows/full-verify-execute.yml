name: Execute Full VERIFY

on:
  push:
    branches:
      - verify-full-2026-09-18

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-full-2026-09-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute full VERIFY pass
        run: python3 scripts/execute-full-verify-run.py
      - name: Validate research history and operators
        run: |
          python3 scripts/test-research-action-history.py
          python3 scripts/test-research-operators.py
          python3 scripts/validate-typed-relations.py
      - name: Commit full VERIFY results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/action-history.json docs/research-runs/2026-09-18-verify-full.md company community university
          git diff --cached --quiet && exit 0
          git commit -m 'verify: complete full evidence and relationship pass'
          git push origin HEAD:verify-full-2026-09-18
