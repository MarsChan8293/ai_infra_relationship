name: Validate and Deploy Quartz

on:
  push:
    branches:
      - main
    paths-ignore:
      - link-audit.txt
      - schema/nodes/**
      - schema/node-manifest.json
      - generated/school-coverage.json
      - generated/school-reverse-coverage.json
      - generated/entity-reverse-coverage.json
      - generated/research-reverse-coverage.json
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quartz-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTZ_DIR: /tmp/quartz
  SITE_BASE_URL: MarsChan8293.github.io/ai_infra_relationship

jobs:
  build-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build pre-sync graph inventory
        run: python3 scripts/audit-graph.py --root . --output generated

      - name: Normalize derived graph relationships in workspace
        run: |
          python3 scripts/repair-markdown-quality.py --root . --generated generated
          python3 scripts/migrate-legacy-education.py --root .
          python3 scripts/repair-school-links.py --root .
          python3 scripts/sync-school-people.py --root .
          python3 scripts/sync-entity-people.py --root .
          python3 scripts/sync-research-people.py --root .

      - name: Audit semantic graph and generate final metrics
        run: python3 scripts/audit-graph.py --root . --output generated

      - name: Audit person-school links
        run: python3 scripts/audit-school-links.py --root . --generated generated

      - name: Audit reverse school-person links
        run: python3 scripts/audit-school-reverse-links.py --root . --generated generated

      - name: Audit reverse company/project-person links
        run: python3 scripts/audit-entity-reverse-links.py --root . --generated generated

      - name: Audit reverse research-institution-person links
        run: python3 scripts/audit-research-links.py --root . --generated generated

      - name: Audit typed relations and coverage
        run: python3 scripts/audit-typed-relations.py --root . --generated generated

      - name: Generate full node schema instances
        run: |
          python3 scripts/generate-node-schemas.py \
            --root . \
            --nodes generated/nodes.json \
            --output generated/node-schemas \
            --manifest generated/node-schema-manifest.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch Quartz v5
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git "$QUARTZ_DIR"
          cd "$QUARTZ_DIR"
          npm ci

      - name: Stage normalized knowledge graph content
        run: |
          rm -rf "$QUARTZ_DIR/content"
          mkdir -p "$QUARTZ_DIR/content/generated"

          cp "AI Infra Relationship.md" "$QUARTZ_DIR/content/index.md"
          cp -R company "$QUARTZ_DIR/content/company"
          cp -R community "$QUARTZ_DIR/content/community"
          cp -R university "$QUARTZ_DIR/content/university"
          cp generated/research-queue.md "$QUARTZ_DIR/content/generated/research-queue.md"
          cp generated/typed-relation-coverage.md "$QUARTZ_DIR/content/generated/typed-relation-coverage.md"
          cp generated/school-coverage.md "$QUARTZ_DIR/content/generated/school-coverage.md"
          cp generated/school-reverse-coverage.md "$QUARTZ_DIR/content/generated/school-reverse-coverage.md"
          cp generated/entity-reverse-coverage.md "$QUARTZ_DIR/content/generated/entity-reverse-coverage.md"
          cp generated/research-reverse-coverage.md "$QUARTZ_DIR/content/generated/research-reverse-coverage.md"

          echo "Staged Markdown files: $(find "$QUARTZ_DIR/content" -type f -name '*.md' | wc -l)"

      - name: Normalize and audit staged wikilinks
        env:
          WIKILINK_FAIL_ON_AMBIGUOUS: "1"
          WIKILINK_FAIL_ON_MISSING: "0"
        run: |
          set +e
          node scripts/normalize-wikilinks.mjs "$QUARTZ_DIR/content"
          status=$?
          cp "$QUARTZ_DIR/content/.wikilink-audit.json" generated/wikilink-audit.json
          rm -f "$QUARTZ_DIR/content/.wikilink-audit.json"
          exit $status

      - name: Upload graph audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-audit-${{ github.sha }}
          path: generated
          if-no-files-found: warn

      - name: Configure Quartz
        working-directory: ${{ env.QUARTZ_DIR }}
        run: |
          cp quartz.config.default.yaml quartz.config.yaml
          node --input-type=module <<'NODE'
          import fs from "node:fs"
          import YAML from "yaml"

          const path = "quartz.config.yaml"
          const config = YAML.parse(fs.readFileSync(path, "utf8"))

          config.configuration.pageTitle = "AI Infra Relationship"
          config.configuration.pageTitleSuffix = ""
          config.configuration.locale = "zh-CN"
          config.configuration.baseUrl = process.env.SITE_BASE_URL

          for (const plugin of config.plugins ?? []) {
            const source = String(plugin.source ?? "")
            if (source.includes("footer")) {
              plugin.options ??= {}
              plugin.options.links = {
                "关系探索器": "https://MarsChan8293.github.io/ai_infra_relationship/graph-explorer/",
                GitHub: "https://github.com/MarsChan8293/ai_infra_relationship",
              }
            }
            if (source.includes("graph")) {
              plugin.options ??= {}
              plugin.options.localGraph = {
                ...(plugin.options.localGraph ?? {}),
                depth: 1,
                scale: 1.1,
                focusOnHover: true,
              }
              plugin.options.globalGraph = {
                ...(plugin.options.globalGraph ?? {}),
                depth: 2,
                scale: 0.8,
                focusOnHover: true,
                enableRadial: true,
              }
            }
            if (source.includes("og-image") || source.includes("cname")) {
              plugin.enabled = false
            }
          }

          fs.writeFileSync(path, YAML.stringify(config))
          NODE

      - name: Build Quartz
        working-directory: ${{ env.QUARTZ_DIR }}
        run: npx quartz build

      - name: Build focused graph explorer
        run: |
          python3 scripts/build-graph-explorer.py \
            --generated generated \
            --output "$QUARTZ_DIR/public/graph-explorer" \
            --base-path "/ai_infra_relationship" \
            --public-root "$QUARTZ_DIR/public"

      - name: Audit generated internal links
        run: python3 scripts/check-internal-links.py "$QUARTZ_DIR/public" "/ai_infra_relationship"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.QUARTZ_DIR }}/public

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build-and-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
