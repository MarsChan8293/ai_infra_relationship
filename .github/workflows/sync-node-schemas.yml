name: Sync Node Schemas

on:
  push:
    branches:
      - main
    paths:
      - "AI Infra Relationship.md"
      - "company/**/*.md"
      - "community/**/*.md"
      - "university/**/*.md"
      - "research/action-history.json"
      - "schema/*.yaml"
      - "schema/email-domain-company.json"
      - "docs/research-action-planner.md"
      - "docs/research-operators.md"
      - "scripts/audit-graph.py"
      - "scripts/generate-research-queue.py"
      - "scripts/plan-research.py"
      - "scripts/plan-research-v3.py"
      - "scripts/record-research-action.py"
      - "scripts/test-research-history.py"
      - "scripts/test-research-operators.py"
      - "scripts/audit-typed-relations.py"
      - "scripts/audit-school-links.py"
      - "scripts/audit-school-reverse-links.py"
      - "scripts/audit-entity-reverse-links.py"
      - "scripts/audit-research-links.py"
      - "scripts/audit-company-community-links.py"
      - "scripts/generate-node-schemas.py"
      - "scripts/migrate-legacy-education.py"
      - "scripts/repair-markdown-quality.py"
      - "scripts/repair-markdown-safe.py"
      - "scripts/repair-school-links.py"
      - "scripts/sync-school-people.py"
      - "scripts/sync-entity-people.py"
      - "scripts/sync-research-people.py"
      - "scripts/sync-explicit-company-community.py"
      - "scripts/sync-company-community.py"
      - ".github/workflows/sync-node-schemas.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-node-schemas-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build pre-migration graph inventory
        run: python3 scripts/audit-graph.py --root . --output generated

      - name: Repair Markdown safely
        run: python3 scripts/repair-markdown-safe.py --root . --generated generated

      - name: Migrate legacy education associations
        run: python3 scripts/migrate-legacy-education.py --root .

      - name: Backfill person-school links
        run: python3 scripts/repair-school-links.py --root .

      - name: Sync reverse school-person links
        run: python3 scripts/sync-school-people.py --root .

      - name: Sync reverse company/project-person links
        run: python3 scripts/sync-entity-people.py --root .

      - name: Sync reverse research-institution-person links
        run: python3 scripts/sync-research-people.py --root .

      - name: Canonicalize explicit company-community assertions
        run: python3 scripts/sync-explicit-company-community.py --root .

      - name: Sync bidirectional company-community links
        run: python3 scripts/sync-company-community.py --root .

      - name: Rebuild graph inventory after repair
        run: python3 scripts/audit-graph.py --root . --output generated

      - name: Test research-action history planner
        run: python3 scripts/test-research-history.py

      - name: Test research operator planner
        run: python3 scripts/test-research-operators.py

      - name: Build history-aware heterogeneous research action queue
        run: python3 scripts/plan-research.py --root . --generated generated --history research/action-history.json --budget 10 --limit 60

      - name: Build Research Operator Planner v3 queue
        run: python3 scripts/plan-research-v3.py --root . --generated generated --history research/action-history.json --budget 10 --limit 60

      - name: Validate Research Operator Planner v3 global output
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("generated/research-actions.json").read_text(encoding="utf-8"))
          assert payload["algorithm"] == "research-operator-planner-v3"
          assert set(payload["operators"]) == {"discover", "verify"}
          assert payload["selected_actions"], "global planner selected no actions"
          assert len({a["action_id"] for a in payload["selected_actions"]}) == len(payload["selected_actions"])
          for action in payload["candidates"]:
              assert action["operator"] in {"discover", "verify"}
              assert isinstance(action.get("trigger"), dict) and action["trigger"].get("kind")
              assert action["operator"] not in action["action_id"].lower()
          print("v3 global output validated:", payload["selected_operator_counts"])
          PY

      - name: Smoke-test seeded EXPAND and VERIFY in isolated output
        run: |
          TMP_GENERATED="$(mktemp -d)"
          cp generated/nodes.json generated/edges.json generated/metrics.json "$TMP_GENERATED/"
          python3 scripts/plan-research-v3.py \
            --root . \
            --generated "$TMP_GENERATED" \
            --history research/action-history.json \
            --seed "Mooncake" \
            --budget 6 \
            --limit 30
          python3 - "$TMP_GENERATED" <<'PY'
          import json
          import sys
          from pathlib import Path

          generated = Path(sys.argv[1])
          payload = json.loads((generated / "research-actions.json").read_text(encoding="utf-8"))
          assert payload["algorithm"] == "research-operator-planner-v3"
          assert payload["seed"], "seed was not resolved"
          assert set(payload["operators"]) == {"expand", "verify"}
          assert payload["selected_actions"], "seeded planner selected no actions"
          ids = [a["action_id"] for a in payload["selected_actions"]]
          assert len(ids) == len(set(ids)), "duplicate action identities in seeded portfolio"
          assert any(a["operator"] == "expand" for a in payload["candidates"]), "no EXPAND candidates"
          for action in payload["candidates"]:
              assert action["operator"] in {"expand", "verify"}
              assert action["operator"] not in action["action_id"].lower()
          print("v3 seeded output validated:", payload["selected_operator_counts"])
          PY

      - name: Validate person-school coverage
        run: python3 scripts/audit-school-links.py --root . --generated generated

      - name: Validate reverse school-person coverage
        run: python3 scripts/audit-school-reverse-links.py --root . --generated generated

      - name: Validate reverse company/project-person coverage
        run: python3 scripts/audit-entity-reverse-links.py --root . --generated generated

      - name: Validate reverse research-institution-person coverage
        run: python3 scripts/audit-research-links.py --root . --generated generated

      - name: Validate bidirectional company-community coverage
        run: python3 scripts/audit-company-community-links.py --root . --generated generated

      - name: Validate typed relations
        run: python3 scripts/audit-typed-relations.py --root . --generated generated

      - name: Generate one schema instance per Markdown node
        run: |
          python3 scripts/generate-node-schemas.py \
            --root . \
            --nodes generated/nodes.json \
            --output schema/nodes \
            --manifest schema/node-manifest.json

      - name: Commit repaired Markdown, graph artifacts, and synchronized schemas
        shell: bash
        run: |
          TRACKED=(
            'AI Infra Relationship.md'
            company community university
            schema/nodes schema/node-manifest.json
            generated/nodes.json generated/edges.json generated/metrics.json
            generated/audit.json generated/graph.json
            generated/typed-edges.json generated/typed-relations-audit.json
            generated/relation-coverage.json generated/typed-relation-coverage.md
            generated/research-queue.md generated/research-actions.json generated/research-priority.json
            generated/research-history-summary.json
            generated/school-coverage.md generated/school-coverage.json
            generated/school-reverse-coverage.md generated/school-reverse-coverage.json
            generated/entity-reverse-coverage.md generated/entity-reverse-coverage.json
            generated/research-reverse-coverage.md generated/research-reverse-coverage.json
            generated/company-community-coverage.md generated/company-community-coverage.json
          )

          if [[ -z "$(git status --porcelain -- "${TRACKED[@]}")" ]]; then
            echo "Markdown, core graph artifacts, history-aware research actions, bidirectional entity links, coverage reports, and node schemas already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add "${TRACKED[@]}"
          git commit -m "chore(graph): sync graph artifacts and reverse links"
          git push origin HEAD:main
