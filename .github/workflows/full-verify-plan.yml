name: Full VERIFY Plan

on:
  push:
    branches:
      - verify-full-plan-2026-09-18

permissions:
  contents: write

jobs:
  plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-full-plan-2026-09-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate VERIFY-only full queue
        run: python3 scripts/plan-research-v3.py --operator verify --budget 2000 --limit 2000 --as-of 2026-09-18
      - name: Commit generated VERIFY queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/research-actions.json generated/research-priority.json generated/research-queue.md generated/research-history-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'chore(verify): generate full VERIFY queue'
          git push origin HEAD:verify-full-plan-2026-09-18
