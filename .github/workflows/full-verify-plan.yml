name: Full VERIFY Plan

on:
  push:
    branches:
      - verify-full-plan-2026-09-18

permissions:
  contents: write

jobs:
  plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-full-plan-2026-09-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate VERIFY-only full queue
        run: python3 scripts/plan-research-v3.py --operator verify --budget 2000 --limit 2000 --as-of 2026-09-18
      - name: Emit compact execution list
        run: |
          python3 - <<'PY'
          import json, collections
          p=json.load(open('generated/research-actions.json',encoding='utf-8'))
          selected=p['selected_actions']
          with open('generated/full-verify-selected.tsv','w',encoding='utf-8') as f:
              f.write('rank\taction_id\tsource\tfamily\trelation\tpriority\ttrigger\thistory\n')
              for i,a in enumerate(selected,1):
                  s=a['source']; h=((a.get('history') or {}).get('latest') or {}).get('status') or 'new'
                  f.write(f"{i}\t{a['action_id']}\t{s['name']}\t{s['family']}\t{a['relation']}\t{a['priority']}\t{(a.get('trigger') or {}).get('kind','')}\t{h}\n")
          c=collections.Counter((a['source']['family'],a['relation']) for a in selected)
          with open('generated/full-verify-summary.md','w',encoding='utf-8') as f:
              f.write(f'# Full VERIFY Summary\n\nSelected actions: {len(selected)}\n\n')
              f.write('| Source family | Relation | Count |\n|---|---|---:|\n')
              for (fam,rel),n in sorted(c.items(), key=lambda x:(-x[1],x[0])):
                  f.write(f'| {fam} | {rel} | {n} |\n')
          PY
      - name: Audit evidence URLs for verify_evidence actions
        run: |
          python3 - <<'PY'
          import json, pathlib, re, urllib.parse, urllib.request, urllib.error, concurrent.futures, collections
          root=pathlib.Path('.')
          p=json.load(open('generated/research-actions.json',encoding='utf-8'))
          actions=[a for a in p['selected_actions'] if a['relation']=='verify_evidence']
          rx=re.compile(r'https?://[^\s<>()\]"\']+')
          def clean(u):
              return u.rstrip('.,;:!?`})]')
          rows=[]; all_urls=[]
          for a in actions:
              sid=a['source']['id']; path=root/(sid+'.md')
              text=path.read_text(encoding='utf-8') if path.exists() else ''
              urls=[]
              for u in rx.findall(text):
                  u=clean(u)
                  if u not in urls: urls.append(u)
              urls=urls[:6]
              row={'action_id':a['action_id'],'source_id':sid,'source_name':a['source']['name'],'family':a['source']['family'],'path':str(path),'urls':urls}
              rows.append(row); all_urls.extend(urls)
          def probe(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 full-verify-audit/1.0','Range':'bytes=0-1024'})
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      code=getattr(r,'status',200) or 200
                      return url,'live',int(code),r.geturl()
              except urllib.error.HTTPError as e:
                  if e.code in (401,403,405,429): return url,'reachable',int(e.code),url
                  return url,'dead',int(e.code),url
              except Exception as e:
                  return url,'unknown',None,type(e).__name__
          unique=list(dict.fromkeys(all_urls))
          results={}
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
              for item in ex.map(probe,unique): results[item[0]]=item[1:]
          summary=collections.Counter()
          for r in rows:
              checked=[]; domains=set(); live=0; reachable=0; dead=0; unknown=0
              for u in r['urls']:
                  status,code,final=results.get(u,('unknown',None,''))
                  checked.append({'url':u,'status':status,'code':code,'final':final})
                  if status=='live': live+=1; reachable+=1
                  elif status=='reachable': reachable+=1
                  elif status=='dead': dead+=1
                  else: unknown+=1
                  if status in ('live','reachable'):
                      try: domains.add(urllib.parse.urlparse(final or u).netloc.lower().removeprefix('www.'))
                      except Exception: pass
              r.update({'checked':checked,'live':live,'reachable':reachable,'dead':dead,'unknown':unknown,'distinct_reachable_domains':len(domains)})
              if reachable>=2 and len(domains)>=2: cls='strong-liveness'
              elif reachable>=1: cls='some-liveness'
              elif r['urls']: cls='unconfirmed-liveness'
              else: cls='no-urls'
              r['audit_class']=cls; summary[cls]+=1
          out={'schema':'ai-infra-relationship/full-verify-evidence-audit-v1','as_of':'2026-09-18','actions':len(rows),'summary':dict(summary),'records':rows}
          pathlib.Path('generated/full-verify-evidence-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          with open('generated/full-verify-evidence-audit.md','w',encoding='utf-8') as f:
              f.write('# Full VERIFY Evidence Audit\n\n')
              f.write(f"Evidence-only actions: {len(rows)}\n\n")
              for k,v in sorted(summary.items()): f.write(f'- {k}: {v}\n')
              f.write('\nThis is a URL/source-liveness audit only. It does not by itself prove every semantic claim.\n')
          PY
      - name: Commit generated VERIFY queue and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/research-actions.json generated/research-priority.json generated/research-queue.md generated/research-history-summary.json generated/full-verify-selected.tsv generated/full-verify-summary.md generated/full-verify-evidence-audit.json generated/full-verify-evidence-audit.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(verify): generate full VERIFY queue and evidence audit'
          git push origin HEAD:verify-full-plan-2026-09-18
