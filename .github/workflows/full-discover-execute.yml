name: Execute Full DISCOVER

on:
  push:
    branches:
      - discover-full-2026-09-18

permissions:
  contents: write

jobs:
  discover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: discover-full-2026-09-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reset current-run history, harden parser, and clean generated nodes
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          run_id='2026-09-18-discover-full'
          history=root/'research/action-history.json'
          hp=json.loads(history.read_text(encoding='utf-8'))
          hp['records']=[r for r in hp.get('records',[]) if r.get('run_id') != run_id]
          history.write_text(json.dumps(hp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          prior=root/'generated/full-discover-frontier.json'
          if prior.exists():
              p=json.loads(prior.read_text(encoding='utf-8'))
              for nid in p.get('created_nodes',[]):
                  f=root/(nid+'.md')
                  if f.exists():
                      text=f.read_text(encoding='utf-8',errors='replace')
                      if 'handle-first maintainer identity' in text:
                          f.unlink()
          path=root/'scripts/execute-full-discover-run.py'
          text=path.read_text(encoding='utf-8')
          text=text.replace(
              "HANDLE_RE = re.compile(r'@([A-Za-z0-9](?:[A-Za-z0-9-]{0,38}))(?!/)')",
              "HANDLE_RE = re.compile(r'(?<![A-Za-z0-9_.+-])@((?>[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})))\\b(?!/)')"
          )
          text=text.replace(
              "BOT_HANDLES = {'github-actions','dependabot','renovate','codecov','all-contributors','pre-commit-ci'}",
              "BOT_HANDLES = {'github-actions','dependabot','renovate','codecov','all-contributors','pre-commit-ci','username','user','owner','global-owner','global-owner1','global-owner2','example','someone','yourname'}"
          )
          text=text.replace(
              "GOV_FILES = ('MAINTAINERS.md','MAINTAINERS','.github/MAINTAINERS.md','CODEOWNERS','.github/CODEOWNERS','OWNERS','OWNERS.md','GOVERNANCE.md')",
              "GOV_FILES = ('MAINTAINERS.md','MAINTAINERS','.github/MAINTAINERS.md')"
          )
          needle="""                hs=[]
                for h in HANDLE_RE.findall(text):
                    if h.lower() not in BOT_HANDLES and h not in hs: hs.append(h)"""
          replacement="""                hs=[]
                section=text
                active_match=re.search(r'(?ims)^##\\s+Active\\s*$([\\s\\S]*?)(?=^##\\s|\\Z)', text)
                if active_match:
                    section=active_match.group(1)
                for line in section.splitlines():
                    line=line.strip()
                    if not line.startswith('|'):
                        continue
                    cols=[c.strip().strip('`*') for c in line.strip('|').split('|')]
                    if not cols:
                        continue
                    candidate=cols[0]
                    if re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,38}', candidate):
                        low=candidate.lower()
                        if low not in BOT_HANDLES and low not in {'github','githubid','id','maintainer','maintainers'} and candidate not in hs:
                            hs.append(candidate)
                for h in HANDLE_RE.findall(section):
                    if h.lower() not in BOT_HANDLES and h not in hs: hs.append(h)"""
          if needle not in text:
              raise SystemExit('maintainer table parser patch target not found')
          text=text.replace(needle,replacement,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Execute full DISCOVER pass
        run: python3 scripts/execute-full-discover-run.py
      - name: Validate research history and operators
        run: |
          python3 scripts/test-research-history.py
          python3 scripts/test-research-operators.py
          python3 scripts/audit-typed-relations.py --root . --generated generated
      - name: Commit full DISCOVER results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/action-history.json docs/research-runs/2026-09-18-discover-full.md generated/full-discover-frontier.json company community university
          git diff --cached --quiet && exit 0
          git commit -m 'discover: complete conservative full frontier pass'
          git push origin HEAD:discover-full-2026-09-18
