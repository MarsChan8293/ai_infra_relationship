schema: ai-infra-relationship/schema-catalog-v1
status: migration
node_schemas:
  person:
    file: schema/person.yaml
    source: explicit-frontmatter
    canonical: true
  person-link:
    file: schema/person-link.yaml
    source: explicit-frontmatter
    canonical: false
    canonical_target_type: person
  company:
    file: schema/company.yaml
    source: explicit-frontmatter
    canonical: true
  project:
    file: schema/project.yaml
    source: explicit-frontmatter
    canonical: true
  project-collection:
    file: schema/project-collection.yaml
    source: explicit-frontmatter
    canonical: true
  community:
    file: schema/community.yaml
    source: explicit-frontmatter
    canonical: true
  school:
    file: schema/school.yaml
    source: explicit-frontmatter
    canonical: true
    content_root: university
  research-institution:
    file: schema/research-institution.yaml
    source: explicit-frontmatter
    canonical: true
    content_root: university
  model-team:
    file: schema/model-team.yaml
    source: explicit-frontmatter
    canonical: true
  model-project:
    file: schema/model-project.yaml
    source: explicit-frontmatter
    canonical: true
  relationship-map:
    file: schema/relationship-map.yaml
    source: explicit-frontmatter
    canonical: false
  index:
    file: schema/index.yaml
    source: derived
    canonical: false
  note:
    file: schema/note.yaml
    source: derived
    canonical: false
non_node_schemas:
  relation:
    file: schema/relation.yaml
    used_by: [person]
  research-action:
    file: schema/research-action.yaml
    used_by: [scripts/plan-research.py]
    generated_output: generated/research-actions.json
  research-action-history:
    file: schema/research-action-history.yaml
    used_by: [scripts/plan-research.py, scripts/record-research-action.py]
    durable_input: research/action-history.json
compatibility:
  university:
    canonical_type: school
    note: "Historical audit code may infer `university` for a school page without explicit frontmatter. New university institution pages must use `type: school` unless they are better represented as `research-institution`."
  affiliation:
    canonical_field: current_affiliations
    applies_to: [person, person-link]
  affiliations:
    canonical_field: current_affiliations
    applies_to: [person, person-link]
  company_on_project:
    canonical_field: companies
    applies_to: [project]
  infra_project:
    canonical_type: project
    note: "Legacy infra-project nodes are migrated to project; do not create new infra-project nodes."
  github_on_community:
    canonical_field: repository
    applies_to: [community]
coverage_policy:
  explicit_entity_types:
    - person
    - person-link
    - company
    - project
    - project-collection
    - community
    - school
    - research-institution
    - model-team
    - model-project
    - relationship-map
  derived_types:
    - index
    - note
  rule: Every graph node type must be listed here and have a schema file before new instances of that type are added.
instance_generation:
  source_of_truth: markdown
  output_root: schema/nodes
  manifest: schema/node-manifest.json
  generator: scripts/generate-node-schemas.py
  rule: Every Markdown graph node must have one generated YAML schema instance. Generated instances are mirrors and must not replace or be edited instead of the Markdown source.
notes:
  - "This catalog is the authoritative registry of node types for the repository."
  - "`relation`, `research-action`, and `research-action-history` are non-node schemas; they do not create Markdown graph entities."
  - "Adding a new `type:` value requires adding its schema and registering it here in the same change."
  - "Existing pages remain in migration mode; schema presence does not mean every legacy page already uses every recommended field."
