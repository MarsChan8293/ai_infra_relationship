schema: ai-infra-relationship/company-v2
status: migration
required:
  - type
  - name
recommended:
  - aliases
  - areas
  - projects
  - linked_projects
  - people
  - linked_people
  - last_verified
fields:
  type:
    const: company
  name:
    type: string
    description: Canonical company or organization name. Chinese companies use the verified Chinese canonical name.
  aliases:
    type: array[string]
  areas:
    type: array[string]
    description: Relevant AI Infra or foundation-model focus areas.
  projects:
    type: array[string]
    description: Human-authored, evidence-backed projects or communities with a direct company relationship.
  linked_projects:
    type: array[string]
    description: Exhaustive derived canonical project/community references from the union of company projects/communities and project/community companies/company assertions. Generated automatically; do not edit by hand.
  people:
    type: array[string]
    description: Optional curated high-value people references; do not mechanically enumerate every employee.
  linked_people:
    type: array[string]
    description: Exhaustive derived reverse references from person current_affiliations. Generated automatically; do not edit by hand.
  founded:
    type: string
  headquarters:
    type: string
  last_verified:
    type: string
    pattern: YYYY-MM
notes:
  - A company node must remain independently readable and explain why the company belongs in the AI Infra graph.
  - Business units and model teams should normally attach to the canonical parent company rather than duplicate company entities.
  - People and project relationships should be evidence-backed; compatibility or customer relationships are not sufficient by themselves.
  - `projects` is human-authored evidence; `linked_projects` is the exhaustive generated mirror of explicit company/project-community assertions from either side.
  - `linked_projects` must not be inferred merely because one or more employees contribute to an open-source project.
  - `people` is curated; `linked_people` is the exhaustive generated reverse set derived only from person `current_affiliations`.
  - `linked_people` must not be interpreted as reporting-line, team, co-worker, or historical-employment evidence by itself.
