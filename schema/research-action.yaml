schema: ai-infra-relationship/research-action-v3
status: active
kind: generated-planning-record
producer: scripts/plan-research.py
base_candidate_generator: scripts/generate-research-queue.py
source_of_truth:
  - generated/nodes.json
  - generated/edges.json
  - generated/metrics.json
  - research/action-history.json
required:
  - action_id
  - action_key
  - operator
  - trigger
  - source
  - relation
  - target_families
  - strategies
  - bucket
  - base_priority
  - priority
  - eligible
  - cost
  - coverage
  - signals
  - history
fields:
  action_id:
    type: string
    description: Stable per-source planning id in the form <node-id>::<relation>. Operator must not be part of the id.
  action_key:
    type: string
    description: Reusable action class in the form <source-family>:<relation>:<target-family-set>; used for empirical yield/history statistics. Operator must not be part of the key.
  operator:
    type: string
    enum: [expand, discover, verify]
    description: Top-level research operator. expand follows an explicit seed, discover fills graph gaps/frontiers, verify strengthens or challenges evidence.
  trigger:
    type: object
    required: [kind]
    description: Explainable reason this candidate was generated; trigger is not part of action identity.
    fields:
      kind:
        type: string
        enum: [seed, coverage_gap, frontier, bridge, weak_evidence, history_followup]
      seed:
        type: string
        description: Optional canonical seed id/name for expand actions.
      distance:
        type: integer
        description: Optional graph distance from the seed; used only as a soft signal.
      detail:
        type: string
        description: Optional human-readable trigger detail.
  source:
    type: object
    required: [id, name, type, family]
    description: Existing canonical graph node from which research starts.
  relation:
    type: string
    description: Typed research objective such as maintainers, projects, key_people, academic_lineage, or verify_evidence.
  target_families:
    type: array[string]
    description: Expected canonical entity families; empty for evidence-only verification actions.
  strategies:
    type: array[string]
    description: Preferred primary-source search strategies for a bounded agent run.
  write_hint:
    type: string
    description: Evidence/graph-writing guardrail for the executing agent.
  bucket:
    type: string
    enum: [exploitation, exploration, bridge, verification]
    description: Scheduling label retained for compatibility. It is not a top-level research method; operator carries that semantic.
  base_priority:
    type: number
    description: Deterministic graph-only priority from the candidate generator before history.
  priority:
    type: number
    description: Final history-aware deterministic priority. It is not an entity importance score or calibrated probability.
  eligible:
    type: boolean
    description: False while an exact action is inside a history cooldown window.
  cost:
    type: number
    description: Relative research-cost prior used by the planner.
  coverage:
    type: object
    description: Existing-versus-desired relation coverage. desired is a planning saturation target, not a completeness claim.
  signals:
    type: object
    description: Explainable scoring inputs including graph signals plus history_yield_adjustment, history_status_adjustment, history_eligible, and optional cooldown_until.
  history:
    type: object
    description: Exact-attempt count, latest outcome/cooldown, and small-sample-shrunk action_key statistics.
  reasons:
    type: array[string]
    description: Human-readable explanation for graph priority and relevant history state.
outputs:
  primary: generated/research-actions.json
  markdown_view: generated/research-queue.md
  history_summary: generated/research-history-summary.json
  compatibility: generated/research-priority.json
rules:
  - The only top-level research operators are expand, discover, and verify.
  - expand is seed-driven local heterogeneous expansion; discover is global gap/frontier discovery; verify is evidence strengthening, contradiction checking, and history follow-up.
  - Research actions rank what to investigate next; they must never be interpreted as rankings of people, companies, schools, communities, or projects.
  - A high priority action does not authorize creation of a node or edge without evidence.
  - Operator and trigger must never be added to action_id or action_key; the same source+relation shares one durable history across operators.
  - Recent exact actions marked success, partial, unresolved, or rejected are temporarily ineligible according to status-specific cooldown.
  - partial is a first-class outcome; resolved_dimensions and unresolved_dimensions should guide later follow-up after cooldown.
  - action_key empirical yield may only make a small priority adjustment until sufficient history accumulates.
  - The executing agent should prefer official pages, canonical repositories, governance files, papers, and institutional primary sources.
  - Discovery beyond the bounded action should become a future frontier/action rather than triggering unbounded recursive traversal.
  - Compatibility, sponsorship, co-location, shared employer, or shared school must not be promoted to a direct person relationship without independent evidence.
notes:
  - This is a non-node schema. Existing Markdown nodes do not need migration to adopt research operators.
  - Entity-specific completeness remains derived from current frontmatter plus resolved graph neighbours; no per-node planner metadata is required in Markdown.
  - Durable execution history is validated separately by schema/research-action-history.yaml.
