schema: ai-infra-relationship/person-v2
status: migration
required:
  - type
  - name
recommended:
  - english_name
  - aliases
  - current_affiliations
  - public_email
  - email_affiliations
  - linked_companies
  - schools
  - communities
  - areas
  - roles
  - confidence
  - last_verified
fields:
  type:
    const: person
  name:
    type: string
    description: Canonical display name. Chinese people with a verified Chinese name use the Chinese name here.
  english_name:
    type: string
    description: Verified English name when available.
  aliases:
    type: array[string]
    description: Search aliases only; aliases do not create additional canonical identities.
  current_affiliations:
    type: array[string]
    description: Current company, lab, university, or organization canonical names.
  public_email:
    type: string
    description: Publicly disclosed professional/contact email with direct source evidence. Do not infer addresses from names or organization email patterns; prefer work/institutional addresses over personal mailboxes.
  email_affiliations:
    type: array[string]
    description: Generated organization associations inferred conservatively from public_email using schema/email-domain-company.json. This proves a public professional-domain association, not necessarily current employment.
  linked_companies:
    type: array[string]
    description: Generated canonical company-node references from the union of company-valued current_affiliations and email_affiliations. Do not edit by hand.
  schools:
    type: array[string]
    description: Canonical school names with a verifiable education, employment, postdoc, or visiting-research association. This field does not by itself imply degree, advisor, classmate, or same-lab relations.
  communities:
    type: array[string]
    description: Open-source or technical communities with a verifiable contribution relationship.
  projects:
    type: array[string]
    description: Specific technical projects when communities is too broad.
  areas:
    type: array[string]
    description: Technical focus tags such as inference-engine, kv-cache, compiler, kernels, distributed-serving, communication, ascend.
  roles:
    type: array[string]
    description: Current or notable roles. Historical timing belongs in prose or structured relations.
  confidence:
    type: string
    enum: [verified, high, medium, project-credit, thin-node]
  last_verified:
    type: string
    pattern: YYYY-MM
  relations:
    logical_type: array[relation]
    optional: true
    migration_encoding: json-string-items
    relation_schema: schema/relation.yaml
    description: Each current list item is a JSON object encoded as a YAML string until the legacy frontmatter parser is retired.
legacy_migration:
  company: current_affiliations
  affiliation: current_affiliations
  affiliations: current_affiliations
  education: schools
notes:
  - Existing pages are migrated incrementally. Legacy fields currently produce warnings rather than hard CI failures.
  - `public_email` must come from explicit public evidence such as an official profile, paper, project commit/sign-off, or maintainer record; never synthesize or guess an address.
  - Prefer work or institutional email in `public_email`. Personal QQ/Gmail/Outlook addresses found only in commit metadata should normally remain evidence rather than the canonical contact field when a professional address is unavailable.
  - `email_affiliations` is generated only from allowlisted corporate/institutional domains in `schema/email-domain-company.json`; personal mail providers, GitHub noreply and unmapped domains create no organization edge.
  - An email-domain association means the person publicly used an address under that organization domain in the cited context. It must not be upgraded by itself to current employment, job title, reporting line, or team membership.
  - `linked_companies` is the canonical reverse-graph helper generated from `current_affiliations` plus `email_affiliations`; human-authored organization facts remain in `current_affiliations`.
  - Legacy `education` institutions are migrated into `schools` while the original field can remain during migration; `schools` is the canonical graph association.
  - `schools` is a weak entity association only. It must not be used to infer advisor/student, classmate, same-lab, or degree claims without separate evidence.
  - Person-to-person prose relations must still explain relation type, time/context, and evidence. Structured relations complement prose; they do not replace it.
  - `scripts/audit-typed-relations.py` validates relation targets, relation vocabulary, dates, confidence and evidence URLs, then exports typed edges and coverage metrics.
  - `scripts/audit-school-links.py` validates person-to-school targets and Markdown links, then exports school coverage metrics.
