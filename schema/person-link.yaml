schema: ai-infra-relationship/person-link-v1
status: migration
required:
  - type
  - name
  - canonical
recommended:
  - aliases
  - current_affiliations
  - companies
  - communities
  - areas
  - last_verified
fields:
  type:
    const: person-link
  name:
    type: string
    description: Display name used by this lightweight mirror node.
  canonical:
    type: string
    description: Canonical person path or unique canonical person name. The target must resolve to a real `type: person` node.
  aliases:
    type: array[string]
  current_affiliations:
    type: array[string]
    description: Optional context-local affiliations copied only when useful for navigation; the canonical person page remains authoritative.
  companies:
    type: array[string]
    description: Companies that explain why this mirror exists in the current directory context.
  communities:
    type: array[string]
    description: Communities that explain why this mirror exists in the current directory context.
  areas:
    type: array[string]
  last_verified:
    type: string
    pattern: YYYY-MM
legacy_migration:
  affiliation: current_affiliations
  affiliations: current_affiliations
notes:
  - A person-link is not a second biography. It is a lightweight contextual pointer to one canonical person page.
  - Biography, education, employment history, publications, and full relationship data belong on the canonical `person` node.
  - `canonical` must resolve and must point to a node whose type is `person`; `scripts/audit-graph.py` treats broken canonical targets as hard errors.
  - Context-local prose may explain why the person appears under a company, school, or project, but should not duplicate the full canonical profile.
