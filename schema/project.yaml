schema: ai-infra-relationship/project-v2
status: migration
required:
  - type
  - name
recommended:
  - companies
  - company_relation
  - layer
  - open_source
  - repository
  - areas
  - last_verified
fields:
  type:
    const: project
  name:
    type: string
    description: Canonical project name.
  companies:
    type: array[string]
    description: Only companies with strong origin, founding, core-maintainer, or long-term engineering evidence.
  company_relation:
    type: string
    description: Nature of the company relationship, for example company-originated, company-led, founding-contributors, core-maintainer-network, community-led.
  layer:
    type: string
    description: Primary AI Infra layer such as inference-engine, distributed-serving, kv-cache, compiler, kernel, communication, hardware-backend.
  open_source:
    type: boolean
  repository:
    type: string
    description: Canonical official GitHub or GitCode repository URL.
  areas:
    type: array[string]
  hardware:
    type: array[string]
  governance:
    type: string
  last_verified:
    type: string
    pattern: YYYY-MM
legacy_migration:
  company: companies
notes:
  - Existing project pages are migrated incrementally; legacy singular company currently produces a warning.
  - Compatibility, sponsorship, or downstream usage alone is not enough to put a company in companies.
  - The project body should remain independently readable and include purpose, repository, maintainers/governance, and ecosystem relationships.
